services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teacher_planner
      POSTGRES_PASSWORD: teacher_planner
      POSTGRES_DB: teacher_planner
    ports:
      - "5432:5432"
    volumes:
      - teacher_planner_db:/var/lib/postgresql/data

volumes:
  teacher_planner_db:
