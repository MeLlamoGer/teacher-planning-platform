name: Bootstrap sanitized portfolio source

on:
  push:
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct sanitized source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | tr -d '\n' | base64 -d > /tmp/repo.tar.gz
          tar -xzf /tmp/repo.tar.gz --strip-components=1 -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: publish sanitized portfolio source"
          git push
